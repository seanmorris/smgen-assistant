PRODUCT_NAME: smgen-assistant
TAGLINE: Local answers from static documentation
ORGANIZATION: Sean Morris
TITLE_PREFIX: smgen-assistant

HIGHLIGHT_STYLE: zenburn
DEFAULT_THEME: theme-assistant
DEV_PORT: 8100

STYLES:
  - /default.css
  - /site.css

DEFER_SCRIPTS:
  - /main.js
  - /theme-variant.js

BODY_SCRIPTS:
  - /__smgen-assistant/loader.js

SEARCH_ENABLED: 0
SMGEN_ENGINE: php

PLUGINS:
  - use: ./smgen.plugin.yaml
    options:
      config: .smgen-assistant.yaml
    watch:
      - .smgen-assistant.yaml

LLMS:
  title: smgen-assistant
  summary: Build a private in-browser assistant for static SMGen documentation.
  details: |
    The published assistant uses static assets. Retrieval and model inference
    run in the visitor's browser.
  sections:
    start:
      title: Start Here
      weight: 0
    guides:
      title: Guides
      weight: 10
    reference:
      title: Reference
      weight: 20
    optional:
      title: Optional
      weight: 100

MENUS:
  documentation:
    label: Documentation
    renderer: tree
    hierarchy: source
    showLabel: true

MENU_REGIONS:
  sidebar: [documentation]
