<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Documentation assistant</title>
  <link rel="stylesheet" href="assistant.css">
</head>
<body>
  <main class="assistant" aria-labelledby="assistant-title">
    <header class="header">
      <div class="heading">
        <h1 id="assistant-title">Ask this site</h1>
        <p id="status">Loading documentation…</p>
      </div>
      <div class="header-actions">
        <button id="new-chat" class="text-button" type="button">New chat</button>
        <button id="maximize" class="icon-button" type="button" aria-label="Expand assistant" title="Expand assistant">↗</button>
        <button id="close" class="icon-button close-button" type="button" aria-label="Close assistant" title="Close assistant">×</button>
      </div>
    </header>

    <div id="messages" class="messages" aria-label="Conversation"></div>
    <p id="live-status" class="visually-hidden" role="status" aria-live="polite"></p>

    <form id="question-form" class="composer">
      <div class="composer-input">
        <label class="visually-hidden" for="question">Question about this site</label>
        <textarea id="question" rows="3" maxlength="2000" required disabled placeholder="Ask about this site"></textarea>
        <div class="actions">
          <button id="submit" type="submit" disabled>Ask</button>
          <button id="cancel" class="secondary" type="button" hidden>Stop</button>
        </div>
      </div>
      <div class="composer-footer">
        <div id="model-choice" class="model-choice" hidden>
          <label for="model-select">Model</label>
          <select id="model-select"></select>
        </div>
        <span id="model-note">The model starts with your first question.</span>
        <span id="character-count">0 / 2000</span>
      </div>
    </form>
  </main>
  <script type="module" src="frame.js"></script>
</body>
</html>
