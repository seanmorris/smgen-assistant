<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Documentation assistant</title>
  <link rel="stylesheet" href="assistant.css">
</head>
<body>
  <main class="assistant" aria-labelledby="assistant-title">
    <header class="header">
      <div>
        <h1 id="assistant-title">Ask this site</h1>
        <p id="status" role="status">Loading documentation…</p>
      </div>
      <button id="close" class="icon-button" type="button" aria-label="Close assistant">×</button>
    </header>

    <section id="consent" class="consent" hidden aria-labelledby="consent-title">
      <h2 id="consent-title">Run the assistant on this device</h2>
      <p id="model-details"></p>
      <p>Your questions and the site documentation stay in this browser. The first run downloads and caches the model.</p>
      <button id="enable" type="button">Download and start</button>
      <progress id="progress" max="1" value="0" hidden></progress>
      <p id="progress-label" class="detail" aria-live="polite"></p>
    </section>

    <div id="messages" class="messages" aria-live="polite" aria-label="Conversation"></div>

    <form id="question-form" class="composer">
      <label for="question">Question about this site</label>
      <textarea id="question" rows="2" required disabled></textarea>
      <div class="actions">
        <button id="submit" type="submit" disabled>Ask</button>
        <button id="cancel" class="secondary" type="button" hidden>Stop</button>
      </div>
    </form>
  </main>
  <script type="module" src="frame.js"></script>
</body>
</html>
